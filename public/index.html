  <a class="skip" href="#view">Aller au contenu</a>
  <div id="splash" class="splash" aria-hidden="true"><img src="/icons/logo-128.png" alt=""></div>

  <main id="auth" class="auth" hidden></main>

  <div id="shell" class="shell" hidden>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Nexify, accueil"><img src="/icons/logo-128.png" alt=""><span>Nexify</span></a>
      <form id="top-search" class="top-search" role="search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="top-q" type="search" name="q" placeholder="Rechercher des titres, artistes, albums" aria-label="Rechercher" autocomplete="off" enterkeyhint="search">
      </form>
      <div class="top-actions">
        <span id="net-pill" class="pill offline" hidden><svg class="icon" aria-hidden="true"><use href="#i-offline"/></svg>Hors connexion</span>
        <a class="icon-btn only-mobile" href="#/search" aria-label="Rechercher"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg></a>
        <button id="avatar" class="avatar-btn" type="button" aria-label="Compte et paramètres"><span class="avatar"></span></button>
      </div>
    </header>

    <nav class="side" aria-label="Navigation principale">
      <ul class="nav">
        <li><a href="#/" data-nav="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Accueil</span></a></li>
        <li><a href="#/search" data-nav="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span>Rechercher</span></a></li>
        <li><a href="#/library" data-nav="library"><svg class="icon" aria-hidden="true"><use href="#i-library"/></svg><span>Bibliothèque</span></a></li>
        <li><a href="#/library/downloads" data-nav="downloads"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span>Téléchargements</span></a></li>
      </ul>
      <hr class="side-sep">
      <button id="side-new" class="btn" type="button"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Nouvelle playlist</button>
      <ul id="side-playlists" class="side-playlists" aria-label="Vos playlists"></ul>
    </nav>

    <main id="view" class="view" tabindex="-1"></main>
    <section id="np" class="np" aria-label="Lecture en cours" aria-hidden="true"></section>
    <footer id="player" class="playerbar empty" aria-label="Lecteur"></footer>

    <nav class="bottom-nav" aria-label="Navigation">
      <a href="#/" data-nav="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>Accueil</a>
      <a href="#/search" data-nav="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>Rechercher</a>
      <a href="#/library" data-nav="library"><svg class="icon" aria-hidden="true"><use href="#i-library"/></svg>Bibliothèque</a>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
