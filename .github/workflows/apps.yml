# Applis Nexify : Windows, Linux, macOS (Electron) et Android (Capacitor).
# - Lancement manuel (onglet Actions → Applications → Run workflow) : fichiers en « artefacts ».
# - Étiquette v* (ex. v1.1.0) : publication dans une Release GitHub.
name: Applications

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    name: PC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dépendances
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Construction
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nexify-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Projet Android
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node scripts/prepare-web.mjs
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000' || echo "Icônes par défaut"
          node scripts/android-setup.mjs
          npx cap sync android
      - name: Clé de signature (secrets du dépôt)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexify.jks"
          echo "NEXIFY_KEYSTORE=$RUNNER_TEMP/nexify.jks" >> "$GITHUB_ENV"
      - name: Construction de l'APK
        working-directory: mobile/android
        env:
          NEXIFY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEXIFY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEXIFY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$NEXIFY_KEYSTORE" ]; then
            node ../scripts/android-setup.mjs
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Nexify-android.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Nexify-android.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nexify-android
          path: Nexify-android.apk
          if-no-files-found: error

  release:
    name: Publication
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            **Android** : `Nexify-android.apk` (autorisez l'installation depuis cette source).
            **Windows** : `Nexify-…-win-x64.exe`. **Linux** : `.AppImage` ou `.deb`. **macOS** : `.dmg`.
            Au premier lancement, indiquez l'adresse de votre serveur Nexify. La musique est ensuite récupérée par l'appareil lui-même.
