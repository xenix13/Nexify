# Applis Nexify : Windows, Linux, macOS (Electron) et Android (Capacitor).
# Lancement manuel (onglet Actions → Applications → Run workflow) ou étiquette v* :
# construction puis publication dans la Release v<version> (créée ou mise à jour).
# Les noms de fichiers sont fixes : l'appli Nexify propose ainsi le téléchargement
# de la dernière version (Paramètres → Applications).
name: Applications

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    name: PC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dépendances
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Construction
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nexify-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Projet Android
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node scripts/prepare-web.mjs
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000' || echo "Icônes par défaut"
          node scripts/android-setup.mjs
          npx cap sync android
      - name: Clé de signature (secrets du dépôt)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexify.jks"
          echo "NEXIFY_KEYSTORE=$RUNNER_TEMP/nexify.jks" >> "$GITHUB_ENV"
      - name: Construction de l'APK
        working-directory: mobile/android
        env:
          NEXIFY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEXIFY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEXIFY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$NEXIFY_KEYSTORE" ]; then
            node ../scripts/android-setup.mjs
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Nexify-Android.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Nexify-Android.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nexify-android
          path: Nexify-Android.apk
          if-no-files-found: error

  release:
    name: Publication
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release v<version> (création ou mise à jour)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          ls -la dist
          if ! gh release view "$V" >/dev/null 2>&1; then
            gh release create "$V" --title "Nexify $V" --latest --notes "$(cat <<'NOTES'
          Téléchargez l'appli depuis Nexify (Paramètres → Applications) ou ci-dessous :
          - **Android** : `Nexify-Android.apk`
          - **Windows** : `Nexify-Windows.exe`
          - **Linux** : `Nexify-Linux.AppImage` ou `Nexify-Linux.deb`
          - **macOS** : `Nexify-macOS.dmg`

          Au premier lancement, indiquez l'adresse de votre serveur Nexify.
          NOTES
          )"
          fi
          gh release upload "$V" dist/* --clobber
